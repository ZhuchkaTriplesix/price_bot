name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pricebot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d pricebot" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 3
          done

      - name: Lint (Ruff)
        run: |
          python -m pip install ruff
          ruff format --check .
          ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/pricebot
        run: |
          pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bot image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: false
          tags: local/price-bot:ci

      - name: Build database image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: database/Dockerfile
          push: false
          tags: local/price-database:ci


