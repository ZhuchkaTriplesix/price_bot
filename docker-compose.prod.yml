version: "3.9"

services:
  bot:
    env_file:
      - .env
    environment:
      - DATABASE_GRPC_ADDR=${DATABASE_GRPC_ADDR}
    ports:
      - "8080:8080"

  database:
    env_file:
      - .env
    environment:
      - DATABASE_DSN=${DATABASE_DSN}
      - GRPC_PORT=${GRPC_PORT:-50051}
    ports:
      - "50051:50051"

  postgres:
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

