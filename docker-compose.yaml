version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "python", "-m", "bot.src.main"]
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "8080:8080"
    depends_on:
      - database

  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"

  # Database moved to a separate service per future architecture; not started here